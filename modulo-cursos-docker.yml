# PERFIL docker (produccion): base MySQL PROPIA de este microservicio, RabbitMQ y registry por nombre de servicio.
# Las claves vienen de variables de entorno (docker-compose + archivo .env), no se escriben aca.
server:
  port: 8083
management:
  endpoints:
    web:
      exposure:
        # Solo lo necesario para monitoreo. NO se expone "*": endpoints como
        # heapdump / env / configprops pueden filtrar secretos (ej: el JWT secret).
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
eureka:
  client:
    service-url:
      defaultZone: http://registry:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
spring:
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        retry:
          # no reintentar mensajes que fallan
          enabled: false
        # un mensaje rechazado NO vuelve a la cola (evita el loop infinito)
        default-requeue-rejected: false
  datasource:
    url: jdbc:mysql://cursos-db:3306/cursos_database?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: cursos_user
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
